name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
      - name: Build and test
        run: ./gradlew clean build
      - name: Validate version and create checksum
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$TAG_NAME" != "v$mod_version" ]]; then
            echo "Tag $TAG_NAME does not match mod version $mod_version" >&2
            exit 1
          fi

          mod_jar="build/libs/autosell-$mod_version.jar"
          test -f "$mod_jar"
          sha256sum "$mod_jar" > "$mod_jar.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: autosell-${{ github.ref_name }}
          path: |
            build/libs/autosell-*.jar
            build/libs/autosell-*.jar.sha256
            !build/libs/*-sources.jar
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mod_version="${TAG_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '## Install' \
            '' \
            "1. Install Minecraft Java 26.2, Fabric Loader 0.19.3 or newer, and Fabric API for Minecraft 26.2." \
            "2. Download **autosell-$mod_version.jar** from the Assets section below." \
            "3. Copy the JAR into the Minecraft \`mods\` directory." \
            '4. Join the server and press **F6** to enable Auto Sell.' \
            '' \
            'Auto Sell always starts disabled. The F6 key can be changed in Minecraft Controls.' \
            > "$notes_file"

          gh release create "$TAG_NAME" \
            "build/libs/autosell-$mod_version.jar#Auto Sell $mod_version (Minecraft 26.2)" \
            "build/libs/autosell-$mod_version.jar.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "Auto Sell $mod_version for Minecraft 26.2" \
            --notes-file "$notes_file"
